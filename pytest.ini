[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
markers =
    cuda: requires a CUDA device (and FlashAttention for attention tests)
    integration: exercises multiple real components together
    known_bug: regression contract currently violated; remains a real failure
    roadmap: acceptance test for an engine milestone; TODO implementations fail normally
    nano: core behavior follows the pinned nano-vllm reference
    extension: optional MicroInfer helper or stronger guard, not upstream API parity
